spring.application.name=backend

# Configuração do banco de dados H2 gravando em arquivo
spring.datasource.url=jdbc:h2:file:./data/pontosdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Paginação Spring Data Web
spring.data.web.pageable.serialization-mode=via_dto
